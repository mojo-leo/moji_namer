[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moji_namer"
version = "0.0.2"

description = "A small python utility to make ChatGPT API calls to rename picture files."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.txt" }
requires-python = ">=3.8"

authors = [
  { name = "Lucas Sinclair" },
  { name = "Paul Rougieux" }
]

dependencies = [
  "openai>=1.50.0",
]

[project.urls]
Homepage = "https://github.com/xapple/moji_namer/"